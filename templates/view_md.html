<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{{ .title }}</title>
  <link rel="shortcut icon" href="/static/favicon.ico" />
  <link rel="stylesheet" href="/static/styles/view_md.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.css" />
<script>
  window.MathJax = {
    tex: {
      inlineMath: [['$', '$'], ['\\(', '\\)']],
      displayMath: [['$$', '$$'], ['\\[', '\\]']],
      processEscapes: true
    },
    svg: {
      fontCache: 'global'
    }
  };
</script>
<script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
</head>
<body class="dark-mode">
  <div class="container">
    <div class="markdown-body" data-file-id="{{ .id }}">
      <p>Cargando...</p>
    </div>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="/static/js/copy.js"></script>
  <script type="module">
    import { Marked } from "https://cdn.jsdelivr.net/npm/marked/lib/marked.esm.js";

    document.addEventListener("DOMContentLoaded", async () => {
      const container = document.querySelector(".markdown-body");
      const id = container.dataset.fileId;

      try {
        const res = await fetch(`/file/${id}`);
        if (!res.ok) {
          container.innerHTML = `<p>File not found (${res.status}).</p>`;
          return;
        }

        const rawMarkdown = await res.text();
        const marked = new Marked();
        container.innerHTML = marked.parse(rawMarkdown);

        document.querySelectorAll("pre code").forEach((block) => {
          hljs.highlightElement(block);
        });

        if (window.MathJax && MathJax.typesetPromise) {
          await MathJax.typesetPromise([container]);
        }
      } catch (err) {
        container.innerHTML = `<p>Error while trying to load the file.</p>`;
        console.error(err);
      }
    });
  </script>
</body>
</html>
