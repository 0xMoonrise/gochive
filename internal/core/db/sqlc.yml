version: "2"
sql:
  - engine: "sqlite"
    schema: "sql/schema.sql"
    queries: "sql/queries.sql"
    gen:
      go:
        package: "database"
        out: "../internal/database"
        emit_json_tags: true
        emit_interface: true
        overrides:
          - db_type: "integer"
            go_type: "int"
          - column: "archive.id"
            go_type: "int"
